name: Build Flatpak bundles

on:
  workflow_call:

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak (${{ matrix.app }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        app: [Diatar, DiaVetito]
        platform:
          - arch: x86_64
            runner: ubuntu-24.04
            artifact: linux
          - arch: aarch64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    steps:
      - name: Checkout packaging tools
        uses: actions/checkout@v4

      - name: Download matching Linux build
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.platform.artifact }}
          path: input

      - name: Install Flatpak tooling and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream-util desktop-file-utils
          # Ubuntu 24.04 otherwise blocks bubblewrap's unprivileged user namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49

      - name: Prepare bundle and metadata
        env:
          APP: ${{ matrix.app }}
          LINUX_ARTIFACT: ${{ matrix.platform.artifact }}
        run: |
          python3 -m unittest discover -s tools -p 'test_prepare_flatpak.py'
          python3 tools/prepare-flatpak.py "$APP" "input/$APP-$LINUX_ARTIFACT.tar.gz" build/flatpak-input
          appstream-util validate-relax --nonet build/flatpak-input/*.metainfo.xml
          desktop-file-validate build/flatpak-input/*.desktop

      - name: Build Flatpak
        env:
          APP: ${{ matrix.app }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          if [ "$APP" = Diatar ]; then APP_ID=eu.diatar.diatar; else APP_ID=eu.diatar.vetito; fi
          flatpak-builder --user --disable-rofiles-fuse --sandbox \
            --arch="$ARCH" --default-branch=stable --repo=build/flatpak-repo \
            --state-dir=build/flatpak-state \
            build/flatpak-app "build/flatpak-input/$APP_ID.yaml"
          flatpak build --runtime build/flatpak-app sh < tools/check-flatpak-libraries.sh
          flatpak build-bundle --arch="$ARCH" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            build/flatpak-repo "$APP-$ARCH.flatpak" "$APP_ID" stable

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-flatpak-${{ matrix.platform.arch }}
          path: ${{ matrix.app }}-${{ matrix.platform.arch }}.flatpak
          if-no-files-found: error
