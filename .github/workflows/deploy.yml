name: Deploy to Stores

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Deploy Android (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ matrix.app }}/android

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ matrix.app }}/android/app/keystore.jks
          cd ${{ matrix.app }}/android
          echo "storeFile=keystore.jks" > key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> key.properties
          echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> key.properties

      - name: Decode Play Store JSON key
        run: |
          # Use single quotes so bash does not interpret the double quotes
          # inside the JSON secret (which would corrupt the file content).
          echo '${{ secrets.PLAY_STORE_JSON_KEY }}' > ${{ matrix.app }}/android/play_store_key.json

      - name: Fastlane Deploy
        working-directory: ${{ matrix.app }}/android
        env:
          PLAY_STORE_JSON_KEY_FILE: play_store_key.json
          PUSH_BRANCH: ${{ startsWith(github.ref, 'refs/tags/') && (github.event.repository.default_branch || 'main') || github.ref_name }}
        run: bundle exec fastlane deploy

  ios:
    name: Deploy iOS (${{ matrix.app }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ${{ matrix.app }}/ios

      - name: Decode App Store Connect API key
        run: |
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 -d > ${{ matrix.app }}/ios/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Fastlane Deploy
        working-directory: ${{ matrix.app }}/ios
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_FILEPATH: AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          PUSH_BRANCH: ${{ startsWith(github.ref, 'refs/tags/') && (github.event.repository.default_branch || 'main') || github.ref_name }}
        run: bundle exec fastlane deploy
