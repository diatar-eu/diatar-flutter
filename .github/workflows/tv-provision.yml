name: tvOS Match Provision

on:
  workflow_dispatch:

concurrency:
  group: tv-provision
  cancel-in-progress: false

jobs:
  provision-tvos:
    name: Provision tvOS AppStore profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install fastlane
        run: sudo gem install fastlane

      - name: Decode App Store Connect API key
        run: |
          echo "${{ secrets.APPLE_API_KEY_BASE64 }}" | base64 -d > DiaVetito/tvos/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Provision tvOS profile
        working-directory: DiaVetito/tvos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_FILEPATH: AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: fastlane provision_tvos_profile