name: Build & Deploy Web

on:
  push:
    branches:
      - '**'
    tags:
      - 'v-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Web (${{ matrix.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Determine base-href
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_LC=$(echo '${{ matrix.app }}' | tr '[:upper:]' '[:lower:]')
          # Detect if a custom domain (CNAME) is configured for GitHub Pages.
          # If a custom domain is set, the site is served from the domain root,
          # so the repo name must NOT be included in the base-href.
          # Otherwise (project pages), the repo name is part of the URL path.
          CNAME=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname' 2>/dev/null || echo "")
          if [ -n "$CNAME" ]; then
            echo "Custom domain detected ($CNAME) -> root-relative base"
            echo "base_href=/$APP_LC/" >> "$GITHUB_OUTPUT"
          else
            echo "No custom domain -> repo-relative base"
            echo "base_href=/${{ github.event.repository.name }}/$APP_LC/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Web
        working-directory: ${{ matrix.app }}
        run: flutter build web --release --base-href="${{ steps.base.outputs.base_href }}"

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-web
          path: ${{ matrix.app }}/build/web
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v-') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (for static landing page)
        uses: actions/checkout@v4

      - name: Download Diatar Web Build
        uses: actions/download-artifact@v4
        with:
          name: Diatar-web
          path: deploy/diatar

      - name: Download DiaVetito Web Build
        uses: actions/download-artifact@v4
        with:
          name: DiaVetito-web
          path: deploy/diavetito

      - name: Copy static landing page
        run: cp -r static/* deploy/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4