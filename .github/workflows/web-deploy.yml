name: Build & Deploy Web

on:
  # Build on every branch push (CI). The actual web deploy for release tags only
  # runs after the "Deploy to Stores" workflow has completed (it performs the
  # version bump on the default branch).
  push:
    branches:
      - '**'
  workflow_run:
    workflows: ["Deploy to Stores"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Web (${{ matrix.app }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Determine base-href
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_LC=$(echo '${{ matrix.app }}' | tr '[:upper:]' '[:lower:]')
          # Detect if a custom domain (CNAME) is configured for GitHub Pages.
          # If a custom domain is set, the site is served from the domain root,
          # so the repo name must NOT be included in the base-href.
          # Otherwise (project pages), the repo name is part of the URL path.
          CNAME=$(gh api "repos/${{ github.repository }}/pages" --jq '.cname' 2>/dev/null || echo "")
          if [ -n "$CNAME" ]; then
            echo "Custom domain detected ($CNAME) -> root-relative base"
            echo "base_href=/$APP_LC/" >> "$GITHUB_OUTPUT"
          else
            echo "No custom domain -> repo-relative base"
            echo "base_href=/${{ github.event.repository.name }}/$APP_LC/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Web
        working-directory: ${{ matrix.app }}
        run: flutter build web --release --base-href="${{ steps.base.outputs.base_href }}"

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-web
          path: ${{ matrix.app }}/build/web
          if-no-files-found: error

  android:
    name: Build Android APK (${{ matrix.app }})
    runs-on: ubuntu-latest
    # Only needed when a web deploy happens (see deploy job).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v-') ||
      (github.event_name == 'workflow_run' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: ${{ matrix.app }}
        run: flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  linux:
    name: Build Linux Bundle (${{ matrix.app }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v-') ||
      (github.event_name == 'workflow_run' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Build Linux (Release)
        working-directory: ${{ matrix.app }}
        run: flutter build linux --release

      - name: Package Linux Bundle
        working-directory: ${{ matrix.app }}/build/linux/x64/release
        run: tar -czf ../../../../${{ matrix.app }}-linux.tar.gz bundle

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-linux
          path: ${{ matrix.app }}/${{ matrix.app }}-linux.tar.gz
          if-no-files-found: error

  windows:
    name: Build Windows Bundle (${{ matrix.app }})
    runs-on: windows-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v-') ||
      (github.event_name == 'workflow_run' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        app:
          - Diatar
          - DiaVetito

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter Pub Get
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Build Windows (Release)
        working-directory: ${{ matrix.app }}
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          $bundlePath = "${{ matrix.app }}/build/windows/x64/runner/Release"
          $zipPath = "${{ matrix.app }}/${{ matrix.app }}-windows.zip"
          Compress-Archive -Path "$bundlePath/*" -DestinationPath $zipPath -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows
          path: ${{ matrix.app }}/${{ matrix.app }}-windows.zip
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, android, linux, windows]
    # Deploy on manual dispatch, on a direct 'v-*' tag push, or after a
    # successful "Deploy to Stores" run triggered by a tag starting with 'v'.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v-') ||
      (github.event_name == 'workflow_run' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (for static landing page)
        uses: actions/checkout@v4

      - name: Download Diatar Web Build
        uses: actions/download-artifact@v4
        with:
          name: Diatar-web
          path: deploy/diatar

      - name: Download DiaVetito Web Build
        uses: actions/download-artifact@v4
        with:
          name: DiaVetito-web
          path: deploy/diavetito

      - name: Download Diatar Android APK
        uses: actions/download-artifact@v4
        with:
          name: Diatar-android-apk
          path: deploy/downloads/Diatar

      - name: Download Diatar Linux Bundle
        uses: actions/download-artifact@v4
        with:
          name: Diatar-linux
          path: deploy/downloads/Diatar

      - name: Download Diatar Windows Bundle
        uses: actions/download-artifact@v4
        with:
          name: Diatar-windows
          path: deploy/downloads/Diatar

      - name: Rename Diatar APK
        run: mv deploy/downloads/Diatar/app-release.apk deploy/downloads/Diatar/Diatar.apk

      - name: Download DiaVetito Android APK
        uses: actions/download-artifact@v4
        with:
          name: DiaVetito-android-apk
          path: deploy/downloads/DiaVetito

      - name: Download DiaVetito Linux Bundle
        uses: actions/download-artifact@v4
        with:
          name: DiaVetito-linux
          path: deploy/downloads/DiaVetito

      - name: Download DiaVetito Windows Bundle
        uses: actions/download-artifact@v4
        with:
          name: DiaVetito-windows
          path: deploy/downloads/DiaVetito

      - name: Rename DiaVetito APK
        run: mv deploy/downloads/DiaVetito/app-release.apk deploy/downloads/DiaVetito/DiaVetito.apk

      - name: Copy static landing page
        run: cp -r static/* deploy/

      - name: Build and Deploy Documentation
        run: |
          pip install mkdocs
          mkdocs build -d deploy/docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4