<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diatár & Diavetítő</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --accent: #e94560;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    h1 {
      margin-bottom: 3rem;
      font-size: 2.5rem;
      text-align: center;
      font-weight: 300;
      letter-spacing: 2px;
    }
    .container {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 2.5rem;
      width: 280px;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 30px rgba(233, 69, 96, 0.3);
    }
    .card img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 1.5rem;
    }
    .card h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .card p {
      font-size: 0.95rem;
      opacity: 0.7;
    }
    footer {
      margin-top: 4rem;
      font-size: 0.85rem;
      opacity: 0.5;
      text-align: center;
    }
</style>
</head>
<body>
  <h1>Válassz alkalmazást / Select an application</h1>
  <div class="container">
    <a class="card" href="./diatar/">
      <img src="./diatar.png" alt="Diatár ikon">
      <h2>Diatár</h2>
      <p>Vetítés vezérlése / Control projection</p>
    </a>
    <a class="card" href="./diavetito/">
      <img src="./diavetito.png" alt="Diavetítő ikon">
      <h2>Diavetítő</h2>
      <p>Vetítés követése / Follow projection</p>
    </a>
    <a class="card" href="./docs/">
      <img src="./dokumentacio.png" alt="Dokumentáció ikon">
      <h2>Dokumentáció</h2>
      <p>Használati útmutató és súgó</p>
    </a>
  </div>
  <footer>Diatár &mdash; Web</footer>
</body>
</html>
