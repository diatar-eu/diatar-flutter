app-id: eu.diatar.vetito
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: diavetito
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.mpris.MediaPlayer2.*
modules:
  - name: diavetito
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - cp -a bundle/. /app/bin/
      - install -Dm644 eu.diatar.vetito.desktop /app/share/applications/eu.diatar.vetito.desktop
      - install -Dm644 eu.diatar.vetito.metainfo.xml /app/share/metainfo/eu.diatar.vetito.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/eu.diatar.vetito.png
    sources:
      - type: dir
        path: bundle
        dest: bundle
      - type: file
        path: eu.diatar.vetito.desktop
      - type: file
        path: eu.diatar.vetito.metainfo.xml
      - type: file
        path: icon.png